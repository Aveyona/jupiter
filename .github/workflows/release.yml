name: Vydanie – ZIP doplnku
# Vydanie vznikne samo:
#  - po zlúčení do vetvy main: pre každý doplnok, ktorého verzia (hlavička Version:) ešte nemá značku
#    <doplnok>-v<verzia>, sa vytvorí značka, vydanie a ZIP;
#  - alebo ručne značkou v tvare <doplnok>-v<verzia>, napr. j-invoices-v1.0.0.
on:
  push:
    branches: [main]
    tags: ['j-*-v*']
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Voliteľný tajný kľúč Ed25519 (base64, 64 bajtov) na podpis vydaní – Settings → Secrets → JUPITER_SIGNING_KEY.
      JUPITER_SIGNING_KEY: ${{ secrets.JUPITER_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Kontrola verzií
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            php .github/scripts/check-versions.php "${GITHUB_REF_NAME}"
          else
            php .github/scripts/check-versions.php
          fi
      - name: Vydania
        run: |
          set -e
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags="${GITHUB_REF_NAME}"
          else
            tags=""
            for dir in plugins/j-*/; do
              plugin=$(basename "$dir")
              ver=$(grep -m1 -E '^\s*\*\s*Version:' "$dir/$plugin.php" | awk '{print $NF}')
              tag="$plugin-v$ver"
              # Vydať, ak chýba značka, vydanie alebo jeho ZIP (aj po neúspešnom predchádzajúcom behu).
              if ! gh release view "$tag" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "$tag.zip"; then tags="$tags $tag"; fi
            done
          fi
          for tag in $tags; do
            plugin="${tag%-v*}"
            test -d "plugins/$plugin"
            rm -f "$tag.zip"
            (cd plugins && zip -qr "../$tag.zip" "$plugin" -x '*.git*')
            # Kontrolný súčet a (ak je kľúč) podpis – J-Pomocník ich overí pred inštaláciou.
            sha256sum "$tag.zip" | awk '{print $1}' > "$tag.zip.sha256"
            assets="$tag.zip $tag.zip.sha256"
            if [ -n "$JUPITER_SIGNING_KEY" ]; then
              php -r '$k=base64_decode(getenv("JUPITER_SIGNING_KEY"),true); if(!$k||strlen($k)!==SODIUM_CRYPTO_SIGN_SECRETKEYBYTES){fwrite(STDERR,"Neplatný JUPITER_SIGNING_KEY\n");exit(1);} echo base64_encode(sodium_crypto_sign_detached(file_get_contents($argv[1]),$k));' "$tag.zip" > "$tag.zip.sig"
              assets="$assets $tag.zip.sig"
            fi
            notes=$(php -r '$j=json_decode(file_get_contents("updates.json"),true); echo $j["plugins"][$argv[1]]["notes"] ?? "";' "$plugin")
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" $assets --clobber
            else
              gh release create "$tag" $assets --target "${GITHUB_SHA}" --title "$tag" --notes "${notes:-Vydanie $tag}"
            fi
            echo "Vydané: $tag"
          done
          [ -n "$tags" ] || echo "Žiadna nová verzia na vydanie."
