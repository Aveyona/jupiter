<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Arial, Helvetica, sans-serif">
  <title>J-Doprava – schéma: košík s mapou Packeta, podanie zásielky, štítky, sledovanie, pošta a osobný odber</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f7fc"/><stop offset="1" stop-color="#e8eef8"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker>
  </defs>
  <rect width="1200" height="620" fill="url(#bg)"/>

  <!-- Zákazník -->
  <rect x="40" y="60" width="270" height="270" rx="18" fill="#fff" stroke="#cbd5e1"/>
  <text x="175" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5">KOŠÍK A POKLADŇA</text>
  <text x="175" y="122" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">Zákazník</text>
  <text x="175" y="146" text-anchor="middle" font-size="13" fill="#475569">vyberie spôsob dopravy</text>
  <rect x="62" y="166" width="226" height="56" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="175" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Mapa Packeta</text>
  <text x="175" y="210" text-anchor="middle" font-size="12" fill="#475569">výdajné miesto alebo Z-BOX</text>
  <rect x="62" y="234" width="226" height="56" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="175" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Doručenie na adresu</text>
  <text x="175" y="278" text-anchor="middle" font-size="12" fill="#475569">kuriér, povinný telefón</text>

  <!-- Jadro -->
  <rect x="400" y="40" width="400" height="320" rx="22" fill="url(#core)"/>
  <text x="600" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#bfdbfe" letter-spacing="1.5">ADMINISTRÁCIA WORDPRESSU</text>
  <text x="600" y="118" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">J-Doprava</text>
  <g font-size="14" fill="#e0e7ff">
    <rect x="428" y="140" width="344" height="38" rx="10" fill="#ffffff" fill-opacity=".18"/><text x="600" y="164" text-anchor="middle" font-weight="700">Podanie zásielky (ručne, hromadne, automaticky)</text>
    <rect x="428" y="188" width="166" height="38" rx="10" fill="#ffffff" fill-opacity=".12"/><text x="511" y="212" text-anchor="middle">Štítky PDF</text>
    <rect x="606" y="188" width="166" height="38" rx="10" fill="#ffffff" fill-opacity=".12"/><text x="689" y="212" text-anchor="middle">Sledovanie stavu</text>
    <rect x="428" y="236" width="166" height="38" rx="10" fill="#ffffff" fill-opacity=".12"/><text x="511" y="260" text-anchor="middle">Dobierka</text>
    <rect x="606" y="236" width="166" height="38" rx="10" fill="#ffffff" fill-opacity=".12"/><text x="689" y="260" text-anchor="middle">Spätná zásielka</text>
  </g>
  <text x="600" y="310" text-anchor="middle" font-size="13" fill="#bfdbfe">Slovenská pošta – ePodací hárok (XML)</text>
  <text x="600" y="332" text-anchor="middle" font-size="13" fill="#bfdbfe">osobný odber – e-mail „pripravené na odber“</text>

  <!-- J-Fakturácia -->
  <rect x="890" y="60" width="270" height="270" rx="18" fill="#fff" stroke="#cbd5e1"/>
  <text x="1025" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5">PACKETA</text>
  <text x="1025" y="122" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">API Packety</text>
  <text x="1025" y="146" text-anchor="middle" font-size="13" fill="#475569">zásielky a stavy</text>
  <rect x="912" y="166" width="226" height="56" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="1025" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">Výdajné miesto</text>
  <text x="1025" y="210" text-anchor="middle" font-size="12" fill="#475569">zákazník vyzdvihne s kódom</text>
  <rect x="912" y="234" width="226" height="56" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="1025" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Doručené</text>
  <text x="1025" y="278" text-anchor="middle" font-size="12" fill="#475569">objednávka → Vybavená</text>

  <path d="M312 194 H396" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arb)"/>
  <text x="354" y="184" text-anchor="middle" font-size="12" fill="#1e3a8a" font-weight="700">miesto</text>
  <path d="M312 262 H396" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ar)"/>
  <path d="M802 194 H886" stroke="#15803d" stroke-width="3" fill="none" marker-end="url(#arg)"/>
  <text x="844" y="184" text-anchor="middle" font-size="12" fill="#166534" font-weight="700">podať</text>
  <path d="M886 262 H802" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <text x="844" y="284" text-anchor="middle" font-size="12" fill="#334155" font-weight="700">stav</text>

  <rect x="400" y="400" width="400" height="80" rx="16" fill="#fff" stroke="#cbd5e1"/>
  <text x="600" y="430" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">E-maily zákazníkovi</text>
  <text x="600" y="454" text-anchor="middle" font-size="13" fill="#475569">Objednávka odoslaná · sledovanie v Môj účet</text>
  <path d="M600 362 V396" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#ar)"/>

  <text x="600" y="522" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5">CESTA ZÁSIELKY</text>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="40" y="540" width="160" height="44" rx="22" fill="#fff" stroke="#cbd5e1"/><text x="120" y="567" fill="#0f172a">Objednávka</text>
    <rect x="240" y="540" width="160" height="44" rx="22" fill="#eff6ff" stroke="#bfdbfe"/><text x="320" y="567" fill="#1e3a8a">Podaná</text>
    <rect x="440" y="540" width="160" height="44" rx="22" fill="#eff6ff" stroke="#bfdbfe"/><text x="520" y="567" fill="#1e3a8a">Štítok</text>
    <rect x="640" y="540" width="160" height="44" rx="22" fill="#f0fdf4" stroke="#bbf7d0"/><text x="720" y="567" fill="#166534">Na ceste</text>
    <rect x="840" y="540" width="160" height="44" rx="22" fill="#fff7ed" stroke="#fed7aa"/><text x="920" y="567" fill="#9a3412">Na výdaj</text>
    <rect x="1040" y="540" width="120" height="44" rx="22" fill="#fff" stroke="#cbd5e1"/><text x="1100" y="567" fill="#0f172a">Doručená</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M202 562 H236" marker-end="url(#ar)"/><path d="M402 562 H436" marker-end="url(#ar)"/><path d="M602 562 H636" marker-end="url(#ar)"/><path d="M802 562 H836" marker-end="url(#ar)"/><path d="M1002 562 H1036" marker-end="url(#ar)"/>
  </g>
</svg>
