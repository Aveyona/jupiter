<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Arial, Helvetica, sans-serif">
  <title>J-Účtovníctvo – schéma: zdroje dokladov, automatické účtovanie, účtovné knihy, kontroly, uzávierka a výkazy</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f7fc"/><stop offset="1" stop-color="#e8eef8"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  </defs>
  <rect width="1200" height="620" fill="url(#bg)"/>

  <!-- Zdroje -->
  <rect x="40" y="40" width="270" height="340" rx="18" fill="#fff" stroke="#cbd5e1"/>
  <text x="175" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5">ZDROJE DOKLADOV</text>
  <g font-size="14">
    <rect x="62" y="92" width="226" height="50" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="175" y="114" text-anchor="middle" font-weight="700" fill="#9a3412">J-Fakturácia</text>
    <text x="175" y="132" text-anchor="middle" font-size="12" fill="#475569">vydané a prijaté faktúry</text>
    <rect x="62" y="152" width="226" height="50" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="175" y="174" text-anchor="middle" font-weight="700" fill="#1e3a8a">Banka</text>
    <text x="175" y="192" text-anchor="middle" font-size="12" fill="#475569">pohyby a úhrady (221)</text>
    <rect x="62" y="212" width="226" height="50" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="175" y="234" text-anchor="middle" font-weight="700" fill="#166534">J-Sklad</text>
    <text x="175" y="252" text-anchor="middle" font-size="12" fill="#475569">príjemky, predaný tovar</text>
    <rect x="62" y="272" width="226" height="50" rx="12" fill="#faf5ff" stroke="#e9d5ff"/>
    <text x="175" y="294" text-anchor="middle" font-weight="700" fill="#6b21a8">J-Platby</text>
    <text x="175" y="312" text-anchor="middle" font-size="12" fill="#475569">platby kartou a poplatky</text>
  </g>
  <text x="175" y="356" text-anchor="middle" font-size="12" fill="#64748b">+ pokladňa, majetok, ručné doklady</text>

  <!-- Jadro -->
  <rect x="400" y="40" width="400" height="340" rx="22" fill="url(#core)"/>
  <text x="600" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#bfdbfe" letter-spacing="1.5">PODVOJNÉ ÚČTOVNÍCTVO</text>
  <text x="600" y="118" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">J-Účtovníctvo</text>
  <g font-size="14" fill="#e0e7ff">
    <rect x="428" y="140" width="344" height="38" rx="10" fill="#ffffff" fill-opacity=".18"/><text x="600" y="164" text-anchor="middle" font-weight="700">Automatické účtovanie (každú hodinu)</text>
    <rect x="428" y="188" width="166" height="38" rx="10" fill="#ffffff" fill-opacity=".12"/><text x="511" y="212" text-anchor="middle">Na zaúčtovanie</text>
    <rect x="606" y="188" width="166" height="38" rx="10" fill="#ffffff" fill-opacity=".12"/><text x="689" y="212" text-anchor="middle">Pravidlá banky</text>
    <rect x="428" y="236" width="166" height="38" rx="10" fill="#ffffff" fill-opacity=".12"/><text x="511" y="260" text-anchor="middle">Denník, storno</text>
    <rect x="606" y="236" width="166" height="38" rx="10" fill="#ffffff" fill-opacity=".12"/><text x="689" y="260" text-anchor="middle">Hlavná kniha</text>
    <rect x="428" y="284" width="166" height="38" rx="10" fill="#ffffff" fill-opacity=".12"/><text x="511" y="308" text-anchor="middle">Predvaha</text>
    <rect x="606" y="284" width="166" height="38" rx="10" fill="#ffffff" fill-opacity=".12"/><text x="689" y="308" text-anchor="middle">Saldokonto</text>
  </g>
  <text x="600" y="354" text-anchor="middle" font-size="13" fill="#bfdbfe">účtový rozvrh podľa rámcovej osnovy · séria a číslo dokladu</text>

  <!-- Výstupy -->
  <rect x="890" y="40" width="270" height="340" rx="18" fill="#fff" stroke="#cbd5e1"/>
  <text x="1025" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5">VÝSTUPY</text>
  <g font-size="14">
    <rect x="912" y="92" width="226" height="50" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="1025" y="114" text-anchor="middle" font-weight="700" fill="#1e3a8a">Účtovná závierka Úč MÚJ</text>
    <text x="1025" y="132" text-anchor="middle" font-size="12" fill="#475569">súvaha, výkaz, poznámky</text>
    <rect x="912" y="152" width="226" height="50" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="1025" y="174" text-anchor="middle" font-weight="700" fill="#9a3412">Daň z príjmov PO</text>
    <text x="1025" y="192" text-anchor="middle" font-size="12" fill="#475569">pracovný list DPPO</text>
    <rect x="912" y="212" width="226" height="50" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="1025" y="234" text-anchor="middle" font-weight="700" fill="#166534">Termíny</text>
    <text x="1025" y="252" text-anchor="middle" font-size="12" fill="#475569">priznanie, závierka, preddavky</text>
    <rect x="912" y="272" width="226" height="50" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="1025" y="294" text-anchor="middle" font-weight="700" fill="#334155">Pre účtovníka</text>
    <text x="1025" y="312" text-anchor="middle" font-size="12" fill="#475569">CSV, tlač, otázky</text>
  </g>

  <path d="M312 210 H396" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arb)"/>
  <text x="354" y="200" text-anchor="middle" font-size="12" fill="#1e3a8a" font-weight="700">doklady</text>
  <path d="M802 210 H886" stroke="#15803d" stroke-width="3" fill="none" marker-end="url(#arg)"/>
  <text x="844" y="200" text-anchor="middle" font-size="12" fill="#166534" font-weight="700">knihy</text>

  <!-- Spodný rad: cyklus -->
  <g font-size="14">
    <rect x="40" y="440" width="250" height="110" rx="16" fill="#fff" stroke="#cbd5e1"/>
    <text x="165" y="474" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Každý mesiac</text>
    <text x="165" y="500" text-anchor="middle" fill="#475569">kontroly mesiaca</text>
    <text x="165" y="522" text-anchor="middle" fill="#475569">odsúhlasenie banky</text>
    <rect x="340" y="440" width="250" height="110" rx="16" fill="#fff" stroke="#cbd5e1"/>
    <text x="465" y="474" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Uzamknutie</text>
    <text x="465" y="500" text-anchor="middle" fill="#475569">mesiac sa uzavrie</text>
    <text x="465" y="522" text-anchor="middle" fill="#475569">nič sa už neprepíše</text>
    <rect x="640" y="440" width="250" height="110" rx="16" fill="#fff" stroke="#cbd5e1"/>
    <text x="765" y="474" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Ročná uzávierka</text>
    <text x="765" y="500" text-anchor="middle" fill="#475569">odpisy, zásoby, daň</text>
    <text x="765" y="522" text-anchor="middle" fill="#475569">710 / 702 → 701</text>
    <rect x="940" y="440" width="220" height="110" rx="16" fill="#fff" stroke="#cbd5e1"/>
    <text x="1050" y="474" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Nový rok</text>
    <text x="1050" y="500" text-anchor="middle" fill="#475569">počiatočné stavy</text>
    <text x="1050" y="522" text-anchor="middle" fill="#475569">rozdelenie výsledku</text>
  </g>
  <path d="M292 495 H336" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M592 495 H636" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M892 495 H936" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="600" y="592" text-anchor="middle" font-size="13" fill="#64748b">Na riešenie: úlohy, rozhodnutia a otázky pre účtovníka počas celého roka</text>
</svg>
