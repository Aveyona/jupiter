<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Arial, Helvetica, sans-serif">
  <title>J-Notes – schéma: plány, dokumentácia a poznámky, úlohy a percento, Teraz robím, denník zmien, súbory .md a kôš</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f7fc"/><stop offset="1" stop-color="#e8eef8"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  </defs>
  <rect width="1200" height="620" fill="url(#bg)"/>

  <!-- Vstup -->
  <rect x="40" y="60" width="270" height="290" rx="18" fill="#fff" stroke="#cbd5e1"/>
  <text x="175" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5">VSTUP</text>
  <text x="175" y="122" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">Odkiaľ prídu</text>
  <rect x="62" y="140" width="226" height="56" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="175" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Editor Markdownu</text>
  <text x="175" y="184" text-anchor="middle" font-size="12" fill="#475569">náhľad, Ctrl+S</text>
  <rect x="62" y="206" width="226" height="56" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="175" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Súbory .md</text>
  <text x="175" y="250" text-anchor="middle" font-size="12" fill="#475569">nahratie alebo FTP → inbox</text>
  <rect x="62" y="272" width="226" height="56" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="175" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Skripty a doplnky</text>
  <text x="175" y="316" text-anchor="middle" font-size="12" fill="#475569">jno_save() – plány doplnkov</text>

  <!-- Jadro -->
  <rect x="400" y="40" width="400" height="330" rx="22" fill="url(#core)"/>
  <text x="600" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#bfdbfe" letter-spacing="1.5">ADMINISTRÁCIA WORDPRESSU</text>
  <text x="600" y="118" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">J-Notes</text>
  <g font-size="14" fill="#e0e7ff">
    <rect x="428" y="140" width="344" height="38" rx="10" fill="#ffffff" fill-opacity=".18"/><text x="600" y="164" text-anchor="middle" font-weight="700">Plán · Dokumentácia · Poznámka</text>
    <rect x="428" y="188" width="166" height="38" rx="10" fill="#ffffff" fill-opacity=".12"/><text x="511" y="212" text-anchor="middle">Úlohy ☐ ◐ ☑</text>
    <rect x="606" y="188" width="166" height="38" rx="10" fill="#ffffff" fill-opacity=".12"/><text x="689" y="212" text-anchor="middle">Percento hotovo</text>
    <rect x="428" y="236" width="166" height="38" rx="10" fill="#ffffff" fill-opacity=".12"/><text x="511" y="260" text-anchor="middle">Denník zmien</text>
    <rect x="606" y="236" width="166" height="38" rx="10" fill="#ffffff" fill-opacity=".12"/><text x="689" y="260" text-anchor="middle">Projekty, filtre</text>
  </g>
  <text x="600" y="314" text-anchor="middle" font-size="13" fill="#bfdbfe">ochrana pred prepísaním pri súbežnej úprave</text>
  <text x="600" y="336" text-anchor="middle" font-size="13" fill="#bfdbfe">kôš – obnovenie do 30 dní</text>

  <!-- Výstup -->
  <rect x="890" y="60" width="270" height="290" rx="18" fill="#fff" stroke="#cbd5e1"/>
  <text x="1025" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5">VÝSTUP</text>
  <text x="1025" y="122" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">Čo z toho máte</text>
  <rect x="912" y="140" width="226" height="56" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="1025" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">Teraz robím</text>
  <text x="1025" y="184" text-anchor="middle" font-size="12" fill="#475569">karty rozpracovaných plánov</text>
  <rect x="912" y="206" width="226" height="56" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="1025" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Export .md</text>
  <text x="1025" y="250" text-anchor="middle" font-size="12" fill="#475569">súbor ku každej poznámke</text>
  <rect x="912" y="272" width="226" height="56" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1025" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Tlač a stiahnutie</text>
  <text x="1025" y="316" text-anchor="middle" font-size="12" fill="#475569">poznámka ako dokument</text>

  <path d="M312 205 H396" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arb)"/>
  <text x="354" y="195" text-anchor="middle" font-size="12" fill="#1e3a8a" font-weight="700">text</text>
  <path d="M802 205 H886" stroke="#15803d" stroke-width="3" fill="none" marker-end="url(#arg)"/>
  <text x="844" y="195" text-anchor="middle" font-size="12" fill="#166534" font-weight="700">prehľad</text>

  <g font-size="14">
    <rect x="160" y="430" width="260" height="100" rx="16" fill="#fff" stroke="#cbd5e1"/>
    <text x="290" y="464" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Plány doplnkov</text>
    <text x="290" y="490" text-anchor="middle" fill="#475569">opravy, vylepšenia, Na vás</text>
    <rect x="470" y="430" width="260" height="100" rx="16" fill="#fff" stroke="#cbd5e1"/>
    <text x="600" y="464" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Chránený priečinok</text>
    <text x="600" y="490" text-anchor="middle" fill="#475569">.htaccess + náhodný názov</text>
    <rect x="780" y="430" width="260" height="100" rx="16" fill="#fff" stroke="#cbd5e1"/>
    <text x="910" y="464" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">My Notes</text>
    <text x="910" y="490" text-anchor="middle" fill="#475569">rovnaký kód, rodina My</text>
  </g>
  <path d="M600 372 V426" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M600 400 H290 V426" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M600 400 H910 V426" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ar)"/>
  <text x="600" y="584" text-anchor="middle" font-size="13" fill="#64748b">kliknutím na úlohu: otvorená → rozpracovaná → hotová</text>
</svg>
